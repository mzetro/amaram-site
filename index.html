<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Для тебе ❤️</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    overflow: hidden;
    font-family: Arial, sans-serif;
    background: radial-gradient(circle at center, #35152d, #100812 70%);
    color: white;
    height: 100vh;
}

/* ОСНОВНИЙ ЕКРАН */

.screen {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 25px;
    transition: 1s;
}

.hidden {
    opacity: 0;
    pointer-events: none;
    transform: scale(1.08);
}

/* ЗІРКИ */

.particle {
    position: fixed;
    width: 3px;
    height: 3px;
    background: white;
    border-radius: 50%;
    opacity: 0.5;
    animation: float 5s infinite ease-in-out;
}

@keyframes float {
    0%,100% {
        transform: translateY(0);
        opacity: .2;
    }

    50% {
        transform: translateY(-30px);
        opacity: 1;
    }
}

/* ТЕКСТ */

.title {
    font-size: 34px;
    margin-bottom: 15px;
    animation: fadeUp 1.5s ease;
}

.subtitle {
    font-size: 17px;
    opacity: .75;
    margin-bottom: 35px;
}

@keyframes fadeUp {
    from {
        opacity: 0;
        transform: translateY(30px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* КНОПКА */

.mainButton {
    border: none;
    padding: 15px 35px;
    border-radius: 50px;
    background: rgba(255,255,255,.12);
    color: white;
    font-size: 17px;
    cursor: pointer;
    border: 1px solid rgba(255,255,255,.3);
    backdrop-filter: blur(10px);
    transition: .3s;
    box-shadow: 0 0 30px rgba(255,100,180,.2);
}

.mainButton:hover {
    transform: scale(1.08);
    background: rgba(255,100,180,.2);
}

/* СЕРЦЕ */

.heart {
    font-size: 90px;
    animation: heartbeat 1.3s infinite;
    margin-bottom: 25px;
    filter: drop-shadow(0 0 25px #ff4f9a);
}

@keyframes heartbeat {

    0%,100% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.18);
    }

}

/* ПОСЛАННЯ */

.message {
    max-width: 500px;
    font-size: 22px;
    line-height: 1.6;
    animation: fadeUp 1.5s ease;
}

/* GIFT */

.gift {
    font-size: 100px;
    cursor: pointer;
    animation: giftFloat 2s infinite ease-in-out;
    filter: drop-shadow(0 0 25px rgba(255,100,180,.6));
    transition: .4s;
}

.gift:hover {
    transform: scale(1.15);
}

@keyframes giftFloat {

    0%,100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-15px);
    }

}

/* ФІНАЛ */

.finalText {
    font-size: 30px;
    animation: fadeUp 1.5s ease;
}

.finalSmall {
    margin-top: 15px;
    opacity: .7;
    font-size: 17px;
}

/* СЕРДЕЧКА */

.floatingHeart {
    position: fixed;
    bottom: -50px;
    font-size: 25px;
    animation: rise 4s linear forwards;
    pointer-events: none;
}

@keyframes rise {

    0% {
        transform: translateY(0) scale(.8) rotate(0);
        opacity: 1;
    }

    100% {
        transform: translateY(-110vh) scale(1.5) rotate(30deg);
        opacity: 0;
    }

}

</style>
</head>

<body>

<!-- ЧАСТИНКИ -->

<div class="particle" style="left:10%;top:20%"></div>
<div class="particle" style="left:25%;top:70%"></div>
<div class="particle" style="left:45%;top:30%"></div>
<div class="particle" style="left:65%;top:80%"></div>
<div class="particle" style="left:80%;top:25%"></div>
<div class="particle" style="left:90%;top:60%"></div>


<!-- ЕКРАН 1 -->

<section class="screen" id="screen1">

    <div class="heart">♡</div>

    <h1 class="title">
        Для тебе...
    </h1>

    <p class="subtitle">
        Тут є дещо особливе ❤️
    </p>

    <button class="mainButton" onclick="openMessage()">
        Відкрити 💗
    </button>

</section>


<!-- ЕКРАН 2 -->

<section class="screen hidden" id="screen2">

    <div class="heart">♥</div>

    <p class="message">
        Іноді не потрібно багато слів...
        <br><br>
        Достатньо просто знати,
        що є людина, яка робить
        твої дні особливими ❤️
    </p>

    <button class="mainButton" onclick="showGift()">
        Далі ✨
    </button>

</section>


<!-- ЕКРАН 3 -->

<section class="screen hidden" id="screen3">

    <div class="gift" onclick="openGift()">
        🎁
    </div>

    <h2 style="margin-top:25px;">
        Для тебе є подарунок
    </h2>

    <p class="subtitle">
        Натисни на нього
    </p>

</section>


<!-- ФІНАЛ -->

<section class="screen hidden" id="screen4">

    <div class="heart">❤️</div>

    <h1 class="finalText">
        Ти особлива людина ❤️
    </h1>

    <p class="finalSmall">
        І це маленьке нагадування про це.
    </p>

</section>


<script>

/* ПЕРЕХІД */

function changeScreen(oldScreen, newScreen) {

    oldScreen.classList.add("hidden");

    setTimeout(() => {

        newScreen.classList.remove("hidden");

    }, 700);

}


/* ПЕРШИЙ ПЕРЕХІД */

function openMessage() {

    changeScreen(
        document.getElementById("screen1"),
        document.getElementById("screen2")
    );

}


/* GIFT */

function showGift() {

    changeScreen(
        document.getElementById("screen2"),
        document.getElementById("screen3")
    );

}


/* ВІДКРИТТЯ ПОДАРУНКА */

function openGift() {

    createHearts();

    setTimeout(() => {

        changeScreen(
            document.getElementById("screen3"),
            document.getElementById("screen4")
        );

    }, 900);

}


/* ЛЕТЮЧІ СЕРДЕЧКА */

function createHearts() {

    for(let i = 0; i < 35; i++) {

        const heart = document.createElement("div");

        heart.className = "floatingHeart";

        heart.innerHTML =
            Math.random() > 0.5 ? "❤️" : "💗";

        heart.style.left =
            Math.random() * 100 + "vw";

        heart.style.animationDuration =
            (3 + Math.random() * 3) + "s";

        heart.style.fontSize =
            (15 + Math.random() * 25) + "px";

        document.body.appendChild(heart);

        setTimeout(() => {
            heart.remove();
        }, 6000);

    }

}

</script>

</body>
</html>
